{% extends "base.html" %}
{% block title %}{{ tag.name }} — Find You{% endblock %}
{% block content %}

<section class="card">
  <div class="row spread">
    <h2 id="tag-name">{{ tag.name }}</h2>
    <div class="row">
      <select id="history-hours">
        <option value="6">Last 6 h</option>
        <option value="24" selected>Last 24 h</option>
        <option value="72">Last 3 days</option>
        <option value="168">Last 7 days</option>
        <option value="720">Last 30 days</option>
      </select>
      <a class="btn ghost" href="/">Back</a>
    </div>
  </div>
  <div id="tag-meta" class="muted small"></div>
</section>

<section class="card flush">
  <div id="map" data-tag-id="{{ tag.id }}"></div>
</section>

<section class="card">
  <h3>Recent reports</h3>
  <div class="table-wrap">
    <table id="reports-table">
      <thead><tr><th>Time (UTC)</th><th>Latitude</th><th>Longitude</th><th>Accuracy</th></tr></thead>
      <tbody><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
    </table>
  </div>
</section>

{% endblock %}
{% block scripts %}<script>initTag({{ tag.id }});</script>{% endblock %}
